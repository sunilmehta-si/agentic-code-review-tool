# Each update waits 14 days after a release, so a compromised or withdrawn release is usually found before it is
# proposed. Security updates are not delayed.
# Pinned SHAs and digests are only safe if they are kept current: Dependabot opens weekly update PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
