name: code-review

# The tool reviews pull requests to its own repository, with the Claude reviewer on when the
# ANTHROPIC_API_KEY secret exists. Without it (forks, Dependabot, or the secret removed) the
# deterministic review is posted on its own.
#
# SARIF is not uploaded here: on pull requests GitHub code scanning would repeat every inline
# comment the review already posts.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write     # summary review and inline comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Agentic code review
        uses: ./
        with:
          fail-on: high
          ai: ${{ secrets.ANTHROPIC_API_KEY != '' && 'claude' || 'none' }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          scanners: none
          sarif-file: ""
