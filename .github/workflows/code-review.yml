name: code-review

# The tool reviews pull requests to its own repository, with the Claude reviewer on.
# Pull requests from forks and Dependabot don't receive ANTHROPIC_API_KEY; for them the AI step is
# skipped and the deterministic review is still posted.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write     # summary review and inline comments
      security-events: write   # SARIF upload to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Agentic code review
        uses: ./
        with:
          fail-on: high
          ai: claude
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          scanners: none
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('acr.sarif') != ''
        with:
          sarif_file: acr.sarif
          category: agentic-code-review
