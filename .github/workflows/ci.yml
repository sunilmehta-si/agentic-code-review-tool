name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Unit tests
        # Invalid escape sequences become errors in future Python versions; fail on them now.
        run: python -W error::SyntaxWarning -m unittest discover -s tests -t . -v
      - name: Secret scan of every commit
        run: python scripts/check_secrets.py --history

  dogfood:
    # The tool reviews its own source. Test fixtures deliberately contain insecure patterns, so they are excluded.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Review this repository with acr
        run: acr review --all --no-scanners --exclude 'tests/*' --exclude 'examples/*' --fail-on high

  package:
    # Installs the built wheel rather than an editable checkout, so a module left out of the package fails here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: python -m pip wheel --no-deps -w dist .
      - name: Install it in a clean virtualenv and smoke-test the CLI
        run: |
          python -m venv /tmp/acr-venv
          /tmp/acr-venv/bin/pip install --quiet dist/*.whl
          cd /tmp  # import from the installed wheel, not the checkout
          /tmp/acr-venv/bin/acr --version
          /tmp/acr-venv/bin/acr rules | tail -1
          /tmp/acr-venv/bin/acr explain ACR-AI-010 > /dev/null
          if python -m zipfile -l "$GITHUB_WORKSPACE"/dist/*.whl | grep -E "^(tests|examples)/"; then
            echo "tests or examples were packaged into the wheel"; exit 1
          fi

  demo-gate:
    # The deliberately insecure demo must fail the gate, and every report format must render from one run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: The demo fails the gate and writes every format
        run: |
          status=0
          acr review --root examples/insecure-app --all --no-scanners --fail-on high \
            --format junit -o demo.xml --sarif demo.sarif --json demo.json --markdown demo.md || status=$?
          test "$status" -eq 1 || { echo "expected exit 1 from the demo, got $status"; exit 1; }
          acr review --root examples/insecure-app --all --no-scanners --fail-on never --format gitlab -o demo-gitlab.json
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          assert ET.parse("demo.xml").getroot().find("testsuite").get("failures") != "0"
          assert json.load(open("demo.sarif"))["runs"][0]["results"]
          assert json.load(open("demo.json"))["gate"]["passed"] is False
          assert json.load(open("demo-gitlab.json"))
          assert "Changes requested" in open("demo.md").read()
          print("demo gate and all report formats OK")
          PY
