apiVersion: v1
kind: Namespace
metadata:
  name: inference
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  namespace: inference
spec:
  selector:
    matchLabels: {app: llm}
  template:
    metadata:
      labels: {app: llm}
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          args:
            - --model=acme/custom-model
            - --trust-remote-code
          ports:
            - containerPort: 8000
              hostPort: 8000
          securityContext:
            procMount: Unmasked
          resources:
            limits: {memory: 32Gi, nvidia.com/gpu: 1}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: inference
spec:
  type: LoadBalancer
  selector: {app: ollama}
  ports:
    - port: 11434
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm
  namespace: inference
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Debug "on";
spec:
  rules:
    - host: llm.example.com
