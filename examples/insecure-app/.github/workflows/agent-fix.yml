name: agent-fix
on:
  pull_request:
permissions:
  contents: read
jobs:
  fix:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: claude -p "Fix the failing tests in this PR" --dangerously-skip-permissions
  release:
    uses: some-org/shared-ci/.github/workflows/release.yml@v1
    secrets: inherit
