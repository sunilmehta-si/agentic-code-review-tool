name: nightly
on:
  schedule:
    - cron: "0 2 * * *"
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
      - run: ./scripts/report.sh
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: docker://alpine:3.20
      - run: curl -fsSL https://get.example.com/install.sh | bash
