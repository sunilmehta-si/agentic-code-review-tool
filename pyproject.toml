[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-code-review-tool"
dynamic = ["version"]
description = "Agentic, scanner-grounded code review for the whole pull request: app code, infrastructure, and AI/agent code."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sunil Mehta" }]
keywords = ["code-review", "devsecops", "ai-security", "llm", "agents", "kubernetes", "terraform", "github-actions", "sast", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/sunilmehta-si/agentic-code-review-tool"

[project.scripts]
acr = "agentic_code_review.cli:main"

[tool.setuptools.dynamic]
version = { attr = "agentic_code_review.__version__" }

[tool.setuptools.packages.find]
include = ["agentic_code_review*"]
