# Lets other repositories run acr through the pre-commit framework (https://pre-commit.com).
- id: acr
  name: agentic-code-review-tool
  description: Review changed lines for security issues in app, infrastructure and AI/agent code.
  entry: acr review --no-scanners --fail-on high
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push]
